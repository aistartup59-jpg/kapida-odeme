name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
        working-directory: backend

      - name: Lint backend
        run: npm run lint
        working-directory: backend

      # Covers src and test. `npm run build` deliberately excludes test/ so the compiled
      # output keeps the entry point at dist/main.js, which means the build alone no longer
      # type-checks the test suite.
      - name: Typecheck backend
        run: npm run typecheck
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Build backend Docker image
        run: docker build -t payals-backend:ci .
        working-directory: backend

      # Building the image never proved it could start — a wrong CMD path shipped unnoticed
      # because nothing ever ran the container. This starts it and requires it to fail on the
      # missing database rather than on a missing entry point.
      - name: Verify the backend image has a working entry point
        run: |
          output=$(docker run --rm -e JWT_SECRET=ci -e CREDENTIAL_ENCRYPTION_SECRET=ci \
            payals-backend:ci 2>&1 || true)
          echo "$output"
          if echo "$output" | grep -q "Cannot find module"; then
            echo "::error::The image entry point does not exist" && exit 1
          fi

      - name: Install website dependencies
        run: npm install --no-audit --no-fund
        working-directory: website

      - name: Lint website
        run: npm run lint
        working-directory: website

      - name: Build website
        run: npm run build
        working-directory: website

      - name: Install mobile dependencies
        run: flutter pub get
        working-directory: mobile

      - name: Analyze mobile
        run: flutter analyze
        working-directory: mobile

      - name: Build mobile
        run: flutter build apk --debug
        working-directory: mobile
