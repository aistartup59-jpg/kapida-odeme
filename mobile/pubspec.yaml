name: payals_pos
description: PayALS POS app — bank QR, NFC and cash collection at the door.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.5
  flutter_riverpod: ^2.3.6
  dio: ^5.11.0
  # Renders the provider-issued TR Karekod / EMV payload. It never generates a payment QR of
  # its own — that would be exactly the Payment Link QR ADR-003 forbids.
  qr_flutter: ^4.1.0
  # Pinned below 10.x: newer releases of both plugins build against a Flutter Gradle plugin
  # API that Flutter 3.24.5 does not provide, and fail configuration with
  # "unknown property 'flutter' for extension 'android'".
  flutter_secure_storage: '>=9.2.2 <10.0.0'
  # Receives the order platform's hand-off deep link (ADR-015).
  app_links: '>=6.3.2 <6.4.0'
  # Sends the courier back to the platform's app once the money is in.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
